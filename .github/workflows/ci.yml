name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint
      - name: Formato
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test

      - name: Supabase local
        run: npx supabase start
      - name: Pruebas pgTAP
        run: npx supabase test db
      - name: Lint de la base
        run: npx supabase db lint --level warning --fail-on error
      - name: Tipos generados al día
        run: |
          npx supabase gen types typescript --local > /tmp/database.ts
          diff -u src/types/database.ts /tmp/database.ts || {
            echo "::error::src/types/database.ts no coincide con las migraciones. Ejecuta: npx supabase gen types typescript --local > src/types/database.ts"
            exit 1
          }
      - name: Variables de Supabase local
        run: scripts/write-env.sh

      - name: Build
        run: npm run build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
